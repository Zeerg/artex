services:
 postgres:
 image: postgres:16-alpine
 environment:
 POSTGRES_USER: ${POSTGRES_USER:-artex}
 POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please enter .env Set POSTGRES_PASSWORD}
 POSTGRES_DB: ${POSTGRES_DB:-artex}
 volumes:
 - pgdata:/var/lib/postgresql/data
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
 interval: 5s
 timeout: 3s
 retries: 10
 restart: unless-stopped

 artex:
 image: zeerg/artex:${ARTEX_TAG:-latest}
 depends_on:
 postgres:
 condition: service_healthy
 environment:
 ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
 ARTEX_UPDATE_GITHUB_TOKEN: ${ARTEX_UPDATE_GITHUB_TOKEN:-}
 ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
 OPENAI_API_KEY: ${OPENAI_API_KEY:-}
 ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
 ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
 ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
 ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
 ports:
 - "8787:8787"
 - "127.0.0.1:8788:8788"
 volumes:
 # Include data directory (containing jwt)..key, SQLite etc.)
 # Convenient for direct viewing/backup on the host, container rebuilds don't lose it.
 - ./data:/app/data
 # Mounts the project root directory's skills into the container (overriding the built-in /app/skills in the image);
 # Changing skill does not require rebuilding the image, the container reads this from the host.
 - ./skills:/app/skills
 restart: unless-stopped

volumes:
 pgdata:
